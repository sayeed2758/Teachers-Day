<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1c2a25" />
  <title>Happy Teacher's Day ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="orientation-lock" id="orientationLock">
    <div class="orientation-card">
      <div class="phone-icon">📱</div>
      <h2>Please Rotate Your Phone</h2>
      <p>Turn your device sideways for the full classroom experience.</p>
    </div>
  </div>

  <main id="app" class="app" aria-live="polite">
    <section class="scene scene-corridor is-active" id="corridorScene">
      <img class="scene-art" src="https://loveones-teacherday.netlify.app/corridor_frame.png" alt="Teacher's Day corridor" />
      <div class="corridor-overlay"></div>

      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-content">
          <div class="sparkles">💖 ✨ 💖</div>
          <p class="eyebrow">A little surprise for you</p>
          <h1>Today, the classroom is all about <span id="teacherNameWelcome">YOU</span>.</h1>
          <button class="primary-btn" id="enterBtn" type="button">🚪 Enter the Classroom ✨</button>
        </div>
      </div>
    </section>

    <section class="scene scene-classroom" id="classroomScene" aria-hidden="true">
      <div class="classroom-stage" id="classroomStage">
        <img class="scene-art" src="https://loveones-teacherday.netlify.app/classroom_base.png" alt="Interactive classroom" />

        <button class="hotspot hotspot-report" data-modal="report" aria-label="Open teacher report card"></button>
        <button class="hotspot hotspot-envelope" data-modal="letter" aria-label="Open teacher letter"></button>
        <button class="hotspot hotspot-diary" data-modal="diary" aria-label="Open teacher diary"></button>
        <button class="hotspot hotspot-memory-1" data-modal="memory1" aria-label="Open memory one"></button>
        <button class="hotspot hotspot-memory-2" data-modal="memory2" aria-label="Open memory two"></button>
        <button class="hotspot hotspot-memory-3" data-modal="memory3" aria-label="Open memory three"></button>

        <div class="classroom-copy">
          <span>Today is your day</span>
          <strong id="blackboardTeacher">Thank You, Teacher!</strong>
        </div>

        <div class="look-around" id="lookAround">
          <span>📍 Look around the class!</span>
          <button id="zoomBtn" type="button">Zoom ➔</button>
        </div>
      </div>
    </section>
  </main>

  <div class="top-controls">
    <button id="soundBtn" class="icon-btn" type="button" aria-label="Toggle sound">🔊</button>
  </div>

  <div class="modal-layer" id="modalLayer" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <section class="detail-modal" id="detailModal" role="dialog" aria-modal="true" aria-label="Teacher's Day detail">
      <button class="modal-close" id="modalClose" type="button" aria-label="Close">✕</button>
      <div class="detail-art-wrap" id="detailArtWrap">
        <img id="detailArt" class="detail-art" src="" alt="" />
      </div>
      <div class="detail-copy">
        <p class="modal-kicker" id="detailKicker"></p>
        <h2 id="detailTitle"></h2>
        <p id="detailMessage"></p>
        <div id="detailBullets" class="detail-bullets"></div>
      </div>
    </section>
  </div>

  <script src="assets/js/app.js"></script>
</body>
</html>
